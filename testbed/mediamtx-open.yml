#############################################################################
# BEAT kamera testbedi - "acik" sahte kamera sunucusu (kimlik dogrulamasi YOK)
# Yalniz RTSP + RTMP acik; cakisan portlar (HLS/WebRTC/API/SRT) kapali.
# RTP/RTCP portlari 8010/8011'e tasindi (host uzerinde 8000/8001 dolu olabilir).
#############################################################################
logLevel: info

rtsp: yes
rtspAddress: 127.0.0.1:8554
rtpAddress: 127.0.0.1:8010
rtcpAddress: 127.0.0.1:8011

rtmp: yes
rtmpAddress: 127.0.0.1:1936

hls: no
webrtc: no
api: no
metrics: no
srt: no
pprof: no
playback: no
moq: no

# Herhangi bir path adini (cam1, cam2, ...) kabul et
paths:
  all_others:
