#############################################################################
# BEAT kamera testbedi - KIMLIK DOGRULAMALI sahte kamera sunucusu
# Port 8555. "any" kullanicisi tanimli DEGIL -> anonim erisim reddedilir.
# Yayin/okuma icin kimlik bilgisi zorunlu.
#
# Tanimli hesaplar:
#   admin / admin123      -> publish + read      (guclu-ofis senaryosu)
#   viewer / 12345        -> read only           (zayif-parola senaryosu, read)
#   guest  / (bos)        -> read only           (bos parola senaryosu)
#############################################################################
logLevel: info

rtsp: yes
rtspAddress: 127.0.0.1:8555
rtpAddress: 127.0.0.1:8020
rtcpAddress: 127.0.0.1:8021

rtmp: no
hls: no
webrtc: no
api: no
metrics: no
srt: no
pprof: no
playback: no
moq: no

authMethod: internal
authInternalUsers:
  - user: admin
    pass: admin123
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback

  - user: viewer
    pass: "12345"
    ips: []
    permissions:
      - action: read
      - action: playback

  - user: guest
    pass: ""
    ips: []
    permissions:
      - action: read
      - action: playback

paths:
  all_others:
